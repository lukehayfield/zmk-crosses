###############################################################################
# DISPLAY SETTINGS
###############################################################################

# Enable display support (OLED / LCD)
CONFIG_ZMK_DISPLAY=y

# Blank the display when idle to save power
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Show battery percentage instead of icon only
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y


###############################################################################
# POWER MANAGEMENT & SLEEP
###############################################################################

# Time (ms) before the keyboard is considered idle
CONFIG_ZMK_IDLE_TIMEOUT=5000

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Time (ms) before entering deep sleep (10 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Battery reporting interval (0 = disabled)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=3600


###############################################################################
# KEY SCAN / DEBOUNCING
###############################################################################

# Press debounce (lower = more responsive)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7

# Release debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
